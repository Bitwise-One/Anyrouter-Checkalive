name: Anyrouter Recovery Monitor

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API Base URL'
        required: false
        default: 'https://anyrouter.top/v1'
      model:
        description: 'Codex model for health checks'
        required: false
        default: 'gpt-6-astra'

# Prevent concurrent runs stacking up
concurrency:
  group: monitor-recovery
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Verify Codex CLI
        run: codex --version

      - name: Monitor tokens for recovery
        env:
          ANYROUTER_TOKENS: ${{ secrets.ANYROUTER_TOKENS }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top/v1' }}
          MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: bash scripts/monitor-recovery.sh
